[package]
name = "board-core"
version = "1.5.0"
description = "Board data, rules, tools and sync shared by the desktop app and the server"
authors = ["Jason S. Wrench"]
edition = "2021"
rust-version = "1.89"

[lib]
name = "board_core"

[features]
default = []
# The sync client (desktop side). The server only needs the merge rules.
client = ["dep:ureq"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dirs = "7"
ureq = { version = "2.12", features = ["json"], optional = true }
