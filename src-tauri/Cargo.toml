[package]
name = "production-board"
version = "1.5.0"
description = "One board for everything in flight"
authors = ["Jason S. Wrench"]
edition = "2021"
rust-version = "1.89"

[lib]
name = "production_board_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
board-core = { path = "../core", features = ["client"] }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dirs = "7"
ureq = { version = "2.12", features = ["json"] }
keyring = "3"

# Each system keeps secrets in its own credential store.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
